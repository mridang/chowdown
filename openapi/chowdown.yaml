openapi: 3.1.0

info:
  title: chowdown API
  version: 1.0.0
  description: |
    The REST API of chowdown, a recipe app that keeps each recipe as a Cooklang
    file in the user's own Google Drive.

    Conventions (following the Zalando RESTful API guidelines):

    - JSON property names are `snake_case`; paths are `kebab-case` plural nouns.
    - Errors are `application/problem+json` (RFC 9457).
    - Lists are cursor-paginated and carry absolute `self` / `next` links.
    - Recipes carry an `ETag`; send it back as `If-Match` on writes.
    - `PATCH` uses JSON Merge Patch (RFC 7396).

    Signing in and connecting Google Drive are separate steps. A signed-in
    person who has not connected Drive can read the recipes cached here, but
    anything that reads or writes their Drive files answers `409` with a
    problem of type `/problems/drive-not-connected`.

    Writes (`POST`, `PUT`, `PATCH`, `DELETE`) must come from this site's own
    pages; a cross-site write is refused with `403`.

    Not part of this API: the MCP endpoint (`/api/mcp`, JSON-RPC), the OAuth
    endpoints (`/oauth/*`, `/.well-known/*`), the Google sign-in redirects
    (`/api/auth/*`) and the health check. Auto-tagging (`POST /rpc/tag-recipe`)
    is a model call rather than a resource, so it lives outside the API too.
  contact:
    name: chowdown
    url: https://chowdown.apps.mrida.ng
  x-api-id: 6f1b0c5e-2c0a-4a4d-9d7e-5a1f3c9b7e21
  x-audience: external-public

servers:
  - url: https://chowdown.apps.mrida.ng/api
    description: Production

security:
  - sessionCookie: []

tags:
  - name: recipes
    description: The user's recipes, and what is derived from them.
  - name: recipe-notes
    description: Personal notes on a recipe.
  - name: recipe-imports
    description: Turning pasted links and text into recipe drafts.
  - name: users
    description: The signed-in user, their favourites and connected apps.
  - name: sessions
    description: Signing out.

paths:
  /recipes:
    get:
      tags: [recipes]
      summary: List recipes
      description: |
        The user's recipes, from the cache. Filters combine with AND across
        facets; several values for one facet (comma-separated) mean "any of".
      operationId: listRecipes
      parameters:
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/favourite'
        - name: source_site
          in: query
          description: Only recipes saved from these sites (comma-separated, e.g. `seriouseats.com`).
          schema: { type: string }
        - name: protein
          in: query
          schema: { type: string }
          description: One or more proteins, comma-separated.
        - name: cuisine
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: diet
          in: query
          schema: { type: string }
          description: Dietary needs such as `Gluten-free`, comma-separated. `Vegetarian` and `Vegan` moved to `diet_type`, which is worked out from the ingredients.
        - name: diet_type
          in: query
          schema:
            type: string
          description: Eating style, comma-separated, from `Vegan`, `Vegetarian`, `Pescatarian` and `Non-vegetarian`. Worked out from the ingredients; it can't be written.
        - name: difficulty
          in: query
          schema: { type: string }
        - name: method
          in: query
          schema: { type: string }
      responses:
        '200':
          description: A page of recipes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipePage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [recipes]
      summary: Create a recipe
      description: |
        Saves a recipe from Cooklang text. The recipe's `>> source:` URL is a
        secondary key: if a recipe from that URL already exists, it is returned
        with `200` instead of creating a duplicate.
      operationId: createRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipeCreation' }
      responses:
        '201':
          description: Created.
          headers:
            Location:
              description: The new recipe.
              schema: { type: string, format: uri }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recipe' }
        '200':
          description: A recipe from this source already exists; it is returned unchanged.
          headers:
            Content-Location:
              schema: { type: string, format: uri }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recipe' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/DriveNotConnected' }
        '415': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /recipes/{recipe-id}:
    parameters:
      - $ref: '#/components/parameters/recipe-id'
    get:
      tags: [recipes]
      summary: Read a recipe
      operationId: getRecipe
      description: |
        Also available as raw Cooklang (`Accept: text/x-cooklang`) and as
        schema.org JSON-LD (`Accept: application/ld+json`).
      parameters:
        - $ref: '#/components/parameters/If-None-Match'
      responses:
        '200':
          description: The recipe.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recipe' }
            text/x-cooklang:
              schema: { type: string }
            application/ld+json:
              schema: { type: object }
        '304':
          description: Not modified.
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [recipes]
      summary: Replace a recipe's Cooklang text
      operationId: replaceRecipe
      parameters:
        - $ref: '#/components/parameters/If-Match'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipeReplacement' }
      responses:
        '200':
          description: The updated recipe.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recipe' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/DriveNotConnected' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [recipes]
      summary: Edit a recipe's title, images or tags
      description: |
        JSON Merge Patch. Only `title`, `images` and `tags` can be changed;
        anything else (ingredients, steps, `favourite`…) is refused with `400`.
        `null` removes a value.
      operationId: patchRecipe
      parameters:
        - $ref: '#/components/parameters/If-Match'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/RecipePatch' }
          application/json:
            schema: { $ref: '#/components/schemas/RecipePatch' }
      responses:
        '200':
          description: The updated recipe.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recipe' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/DriveNotConnected' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [recipes]
      summary: Delete a recipe
      description: The recipe's Drive file is moved to the Drive trash, so it can be restored there.
      operationId: deleteRecipe
      responses:
        '204':
          description: Deleted.
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/DriveNotConnected' }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /recipes/{recipe-id}/notes:
    parameters:
      - $ref: '#/components/parameters/recipe-id'
    get:
      tags: [recipe-notes]
      summary: List a recipe's notes
      operationId: listRecipeNotes
      responses:
        '200':
          description: The notes, in the order they were added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotePage' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [recipe-notes]
      summary: Add a note
      operationId: createRecipeNote
      parameters:
        - $ref: '#/components/parameters/If-Match'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteInput' }
      responses:
        '201':
          description: Created.
          headers:
            Location:
              schema: { type: string, format: uri }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/DriveNotConnected' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /recipes/{recipe-id}/notes/{note-id}:
    parameters:
      - $ref: '#/components/parameters/recipe-id'
      - $ref: '#/components/parameters/note-id'
    get:
      tags: [recipe-notes]
      summary: Read a note
      operationId: getRecipeNote
      responses:
        '200':
          description: The note.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [recipe-notes]
      summary: Replace a note
      operationId: replaceRecipeNote
      parameters:
        - $ref: '#/components/parameters/If-Match'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteInput' }
      responses:
        '200':
          description: The updated note.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/DriveNotConnected' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [recipe-notes]
      summary: Delete a note
      description: Later notes move up one position, so send `If-Match`.
      operationId: deleteRecipeNote
      parameters:
        - $ref: '#/components/parameters/If-Match'
      responses:
        '204':
          description: Deleted.
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/DriveNotConnected' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /recipes/{recipe-id}/similar-recipes:
    parameters:
      - $ref: '#/components/parameters/recipe-id'
    get:
      tags: [recipes]
      summary: Recipes similar to this one
      operationId: listSimilarRecipes
      responses:
        '200':
          description: Similar recipes, most similar first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeReferencePage' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /recipe-suggestions:
    get:
      tags: [recipes]
      summary: Suggest recipes for a free-text wish
      description: Ranks the user's recipes by how close their meaning is to `q`.
      operationId: listRecipeSuggestions
      parameters:
        - name: q
          in: query
          required: true
          description: What the user feels like, in their own words.
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 8 }
      responses:
        '200':
          description: Suggestions, best first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeReferencePage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/DriveNotConnected' }
        '502': { $ref: '#/components/responses/Problem' }

  /recipe-imports:
    get:
      tags: [recipe-imports]
      summary: List the user's imports
      operationId: listRecipeImports
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: A page of imports, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeImportPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [recipe-imports]
      summary: Import recipes from pasted links and text
      description: |
        Fetches each link, converts each link or block of text to Cooklang and
        returns a draft per item. Nothing becomes a recipe until a draft is
        posted to `/recipes`. A link that fails shows as a `FAILED` item.
      operationId: createRecipeImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipeImportCreation' }
      responses:
        '201':
          description: The import with its drafts.
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeImport' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }

  /recipe-imports/{import-id}:
    parameters:
      - name: import-id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [recipe-imports]
      summary: Read an import
      operationId: getRecipeImport
      responses:
        '200':
          description: The import.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeImport' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [recipe-imports]
      summary: Discard an import
      operationId: deleteRecipeImport
      responses:
        '204':
          description: Discarded.
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /users/self:
    get:
      tags: [users]
      summary: The signed-in user
      operationId: getSelf
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [users]
      summary: Change a preference
      description: JSON Merge Patch. Only `measurement_system` can be changed; `null` clears it.
      operationId: patchSelf
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/UserPatch' }
          application/json:
            schema: { $ref: '#/components/schemas/UserPatch' }
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }

  /users/self/favourite-recipes:
    get:
      tags: [users]
      summary: The user's favourite recipes
      description: Takes the same query parameters as `GET /recipes`; `favourite=true` is implied.
      operationId: listFavouriteRecipes
      parameters:
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: A page of favourite recipes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipePage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }

  /users/self/favourite-recipes/{recipe-id}:
    parameters:
      - $ref: '#/components/parameters/recipe-id'
    get:
      tags: [users]
      summary: A favourite recipe
      operationId: getFavouriteRecipe
      responses:
        '200':
          description: The recipe, if it is a favourite.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeSummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [users]
      summary: Favourite a recipe
      description: Idempotent.
      operationId: addFavouriteRecipe
      responses:
        '204':
          description: The recipe is a favourite.
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [users]
      summary: Un-favourite a recipe
      description: Idempotent; succeeds even if the recipe was not a favourite.
      operationId: removeFavouriteRecipe
      responses:
        '204':
          description: The recipe is not a favourite.
        '401': { $ref: '#/components/responses/Problem' }

  /users/self/connected-apps:
    get:
      tags: [users]
      summary: Apps the user has connected with sign-in
      operationId: listConnectedApps
      responses:
        '200':
          description: The connected apps, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectedAppPage' }
        '401': { $ref: '#/components/responses/Problem' }

  /users/self/connected-apps/{grant-id}:
    parameters:
      - name: grant-id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [users]
      summary: Disconnect an app
      description: Its access and refresh tokens stop working immediately.
      operationId: deleteConnectedApp
      responses:
        '204':
          description: Disconnected.
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /sessions/self:
    delete:
      tags: [sessions]
      summary: Sign out
      description: Idempotent; succeeds when already signed out.
      operationId: deleteSelfSession
      security: []
      responses:
        '204':
          description: Signed out.
        '403': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: chowdown_session
      description: The signed session cookie set by Google sign-in.

  parameters:
    recipe-id:
      name: recipe-id
      in: path
      required: true
      description: The recipe's id (its Google Drive file id).
      schema: { type: string, pattern: '^[a-zA-Z0-9:._\-/]+$' }
    note-id:
      name: note-id
      in: path
      required: true
      description: The note's position among the recipe's notes, starting at 1.
      schema: { type: string, pattern: '^[1-9][0-9]{0,5}$' }
    q:
      name: q
      in: query
      description: Search text, matched against the title, tags and source site.
      schema: { type: string }
    sort:
      name: sort
      in: query
      description: '`title` or `modified_at`, optionally prefixed with `+` (default) or `-`.'
      schema:
        {
          type: string,
          default: '+title',
          pattern: '^[+-]?(title|modified_at)$',
        }
    cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `next` link.
      schema: { type: string }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    favourite:
      name: favourite
      in: query
      description: '`true` for only favourite recipes.'
      schema: { type: boolean }
    If-Match:
      name: If-Match
      in: header
      description: The recipe's `ETag`. The write is refused with `412` if the recipe has changed.
      schema: { type: string }
    If-None-Match:
      name: If-None-Match
      in: header
      description: A previously seen `ETag`; answers `304` if the recipe is unchanged.
      schema: { type: string }

  headers:
    ETag:
      description: Entity tag of the recipe's current Cooklang text.
      schema: { type: string }

  responses:
    Problem:
      description: An error, as problem details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    DriveNotConnected:
      description: |
        The person has signed in but has not connected Google Drive (or Google
        has stopped accepting the connection), so there is nowhere to read or
        write recipe files. The problem `type` is `/problems/drive-not-connected`.
        Nothing was changed. Drive is connected in the browser, from the
        "Connect Google Drive" button; there is no API for it.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          {
            type: string,
            description: 'A relative URI naming the kind of problem.',
          }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items: { type: string }
          description: Per-field messages.

    Tags:
      type: object
      description: 'Facet name to values, for example cuisine: [Indian] and protein: [chicken].'
      additionalProperties:
        type: array
        items: { type: string }

    RecipeSummary:
      type: object
      required: [id, title, tags, favourite, uncurated]
      properties:
        id: { type: string }
        title: { type: string }
        source_url: { type: string, format: uri }
        cover_url: { type: string, format: uri }
        tags: { $ref: '#/components/schemas/Tags' }
        favourite: { type: boolean, readOnly: true }
        uncurated:
          { type: boolean, description: 'A captured idea with no method yet.' }
        modified_at: { type: string, format: date-time }

    Recipe:
      allOf:
        - $ref: '#/components/schemas/RecipeSummary'
        - type: object
          required: [images, cooklang, ingredients, cookware, steps]
          properties:
            images:
              type: array
              items: { type: string, format: uri }
              description: Image URLs, cover first.
            cooklang:
              type: string
              description: The recipe as Cooklang text — the one writable representation.
            ingredients:
              type: array
              readOnly: true
              items:
                type: object
                required: [name]
                properties:
                  name: { type: string }
                  quantity: { type: string }
            cookware:
              type: array
              readOnly: true
              items: { type: string }
            steps:
              type: array
              readOnly: true
              items: { type: string }

    RecipeCreation:
      type: object
      required: [name, cooklang]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        cooklang: { type: string, minLength: 1 }

    RecipeReplacement:
      type: object
      required: [cooklang]
      properties:
        cooklang: { type: string, minLength: 1 }

    RecipePatch:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1 }
        images:
          type: [array, 'null']
          items: { type: string, format: uri }
        tags:
          type: object
          additionalProperties:
            type: [array, 'null']
            items: { type: string }

    RecipePage:
      type: object
      required: [self, items]
      properties:
        self: { type: string, format: uri }
        next: { type: string, format: uri }
        items:
          type: array
          items: { $ref: '#/components/schemas/RecipeSummary' }

    RecipeReference:
      type: object
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }

    RecipeReferencePage:
      type: object
      required: [self, items]
      properties:
        self: { type: string, format: uri }
        items:
          type: array
          items: { $ref: '#/components/schemas/RecipeReference' }

    Note:
      type: object
      required: [id, scope, text]
      properties:
        id: { type: string }
        scope: { type: string, enum: [GENERAL, INGREDIENT, STEP] }
        ingredient: { type: string }
        step: { type: integer, minimum: 1 }
        text: { type: string }

    NoteInput:
      type: object
      required: [text]
      description: At most one of `ingredient` and `step`.
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
        ingredient: { type: string, minLength: 1 }
        step: { type: integer, minimum: 1 }

    NotePage:
      type: object
      required: [self, items]
      properties:
        self: { type: string, format: uri }
        items:
          type: array
          items: { $ref: '#/components/schemas/Note' }

    RecipeImportCreation:
      type: object
      required: [input]
      properties:
        input:
          type: string
          minLength: 1
          maxLength: 100000
          description: Pasted links, markdown and/or recipe text.

    RecipeImportItem:
      type: object
      required: [title, status]
      properties:
        source_url: { type: string, format: uri }
        title: { type: string }
        status: { type: string, enum: [DRAFT, FAILED] }
        cooklang:
          { type: string, description: 'The draft, for a `DRAFT` item.' }
        problem:
          { type: string, description: 'Why it failed, for a `FAILED` item.' }

    RecipeImport:
      type: object
      required: [id, status, created_at, items]
      properties:
        id: { type: string }
        status: { type: string, enum: [COMPLETED] }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/RecipeImportItem' }

    RecipeImportPage:
      type: object
      required: [self, items]
      properties:
        self: { type: string, format: uri }
        next: { type: string, format: uri }
        items:
          type: array
          items:
            type: object
            required: [id, status, created_at, item_count]
            properties:
              id: { type: string }
              status: { type: string, enum: [COMPLETED] }
              created_at: { type: string, format: date-time }
              item_count: { type: integer }

    MeasurementSystem:
      type: string
      enum: [METRIC, US, IMPERIAL]

    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        email: { type: string, format: email, readOnly: true }
        name: { type: string, readOnly: true }
        picture_url: { type: string, format: uri, readOnly: true }
        measurement_system: { $ref: '#/components/schemas/MeasurementSystem' }

    UserPatch:
      type: object
      additionalProperties: false
      properties:
        measurement_system:
          oneOf:
            - { $ref: '#/components/schemas/MeasurementSystem' }
            - { type: 'null' }

    ConnectedApp:
      type: object
      required: [id, name, scopes, connected_at]
      properties:
        id: { type: string }
        name: { type: string }
        scopes:
          type: array
          items: { type: string }
        connected_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }

    ConnectedAppPage:
      type: object
      required: [self, items]
      properties:
        self: { type: string, format: uri }
        items:
          type: array
          items: { $ref: '#/components/schemas/ConnectedApp' }
