# Conformance results this server is known not to meet for the 2025-11-25 revision
# (the `initialize` handshake that Claude, ChatGPT, VS Code and Cursor still open
# with), and why. The newest revision has its own list: expected-failures-2026-07-28.yml.
#
# `npm run conformance` fails on a new failure, and on an entry here that now passes
# (remove it); it also fails before running if an entry names a scenario the
# installed suite does not have. Every scenario the server passes is absent on purpose:
# initialize, ping, tools/list, resources/list, prompts/list and DNS-rebinding protection
# must keep passing, and a regression in the older era's code path fails the run.
server:
  # The suite calls tools that only its own reference server defines (test_simple_text, test_error_handling, ...); chowdown has recipe tools instead.
  - tools-call-audio
  - tools-call-embedded-resource
  - tools-call-error
  - tools-call-image
  - tools-call-mixed-content
  - tools-call-simple-text
  - tools-call-with-progress
  # These need the client to take part (log, sample, elicit), and no tool here asks the client for anything.
  - tools-call-with-logging
  - tools-call-sampling
  - tools-call-elicitation
  - elicitation-sep1034-defaults
  - elicitation-sep1330-enums
  # The suite wants a session id for its multiple-streams test; the server keeps no sessions and no event streams, by design (it only warns).
  - server-sse-multiple-streams:server-sse-multiple-streams-session
  # The suite reads prompts that only its reference server defines (test_simple_prompt, ...); chowdown has its own prompts.
  - prompts-get-embedded-resource
  - prompts-get-simple
  - prompts-get-with-args
  - prompts-get-with-image
  # The suite reads test:// resources that only its reference server serves; chowdown serves views and recipe://{id}.
  - resources-read-binary
  - resources-read-text
  - resources-templates-read
  # The suite calls the reference server's own tool (json_schema_2020_12_tool).
  - json-schema-2020-12
  # Capabilities this server does not declare (no logging, no completion, no subscriptions), so "method not found" is the right answer.
  - logging-set-level
  - completion-complete
  - resources-subscribe
  - resources-unsubscribe
