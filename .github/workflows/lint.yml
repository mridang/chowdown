name: Lint Code (Eslint)

on: push

permissions:
  contents: read

# A newer push makes an older run of this workflow on the same branch pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./

jobs:
  code-linting:
    runs-on: ubuntu-latest
    # A hung step must not run to GitHub's six-hour limit on paid minutes.
    timeout-minutes: 10

    steps:
      - name: Runner Common Setup
        uses: mridang/action-runner-common@v1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Install Dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run Eslint
        run: npm run lint
