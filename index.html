<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chowdown — Cooklang viewer for Google Drive</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">🍳 Chowdown</div>
      <div class="actions">
        <button id="pick-btn" class="btn primary">Open from Drive</button>
        <label class="btn ghost">
          Open local .cook
          <input id="local-input" type="file" accept=".cook,text/plain" hidden />
        </label>
      </div>
    </header>

    <main id="main">
      <div id="empty" class="empty">
        <p>Pick a <code>.cook</code> file from Google Drive, or open a local one to preview the renderer.</p>
        <p id="config-warn" class="warn" hidden>
          ⚠️ Drive isn't configured yet — set <code>CLIENT_ID</code> and <code>API_KEY</code> in
          <code>config.js</code>. The local file button works without it.
        </p>
      </div>
      <article id="recipe" class="recipe" hidden></article>
    </main>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
